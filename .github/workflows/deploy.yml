name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to demo VM
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          tar -czf /tmp/uptime-monitor.tgz app monitor db migrations grafana deploy alembic.ini pyproject.toml README.md
          scp -i ~/.ssh/deploy_key /tmp/uptime-monitor.tgz "$VM_USER@$VM_HOST:/tmp/uptime-monitor.tgz"
          ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" "cd /opt/uptime-monitor && rm -rf app monitor db migrations grafana deploy && tar -xzf /tmp/uptime-monitor.tgz && find deploy -type f -exec sed -i 's/\r//g' {} + && bash deploy/release.sh"

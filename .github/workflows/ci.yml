name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: uptime_monitor
          POSTGRES_USER: uptime_monitor
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uptime_monitor -d uptime_monitor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg://uptime_monitor:change-me@localhost:5432/uptime_monitor
          API_KEY: ci-test-api-key
        run: python -m pytest

      - name: Check lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

  container:
    name: Build and scan container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: uptime-monitor:ci

      - name: Scan application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: uptime-monitor:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format Terraform files
        run: terraform fmt -check -recursive infra

      - name: Validate demo configuration when present
        shell: bash
        run: |
          if find infra/environments/demo -name '*.tf' -print -quit | grep -q .; then
            terraform -chdir=infra/environments/demo init -backend=false
            terraform -chdir=infra/environments/demo validate
          else
            echo "No Terraform configuration exists yet; validation will run when M5 adds it."
          fi

apiVersion: 1

datasources:
  - name: Uptime Postgres
    uid: uptime-postgres
    type: postgres
    access: proxy
    isDefault: true
    url: $UPTIME_DB_HOST
    user: $UPTIME_DB_USER
    jsonData:
      database: uptime_monitor
      sslmode: disable
    secureJsonData:
      password: $UPTIME_DB_PASSWORD

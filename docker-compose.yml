services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - sqlite_data:/data
    environment:
      DATABASE_URL: sqlite:////data/uptime-monitor.db
      API_KEY: dev-api-key
      ALERT_WEBHOOK_URL: ""
      FAILURE_THRESHOLD: "3"
      MAX_CONCURRENT_PROBES: "20"
      DUE_TOLERANCE_SECONDS: "5"
      MAX_REDIRECTS: "0"
      RESPONSE_BYTES_LIMIT: "1048576"
      RETENTION_DAYS: "90"
      PROBE_USER_AGENT: "uptime-monitor-portfolio/1.0"
      LOG_LEVEL: INFO
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    restart: unless-stopped

  checker:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - sqlite_data:/data
    environment:
      DATABASE_URL: sqlite:////data/uptime-monitor.db
      API_KEY: dev-api-key
      ALERT_WEBHOOK_URL: ""
      FAILURE_THRESHOLD: "3"
      MAX_CONCURRENT_PROBES: "20"
      DUE_TOLERANCE_SECONDS: "5"
      MAX_REDIRECTS: "0"
      RESPONSE_BYTES_LIMIT: "1048576"
      RETENTION_DAYS: "90"
      PROBE_USER_AGENT: "uptime-monitor-portfolio/1.0"
      LOG_LEVEL: INFO
    command:
      - sh
      - -c
      - while true; do python -m monitor.checker; sleep 60; done
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  sqlite_data:
  grafana_data:
